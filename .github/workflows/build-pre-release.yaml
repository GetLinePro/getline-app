name: Build Pre-Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Verification path: unsigned Play-shaped AAB. No production signing secrets.
# Production signing lives only in build-release.yaml.
jobs:
  BuildPreRelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo product patches
        run: ./scripts/apply-mihomo-patches.sh

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21.0.10+7.0.LTS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: ./.github/actions/setup-pinned-go

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Intentionally no signing.properties: release must stay unsigned without a key.
      - name: Pre-release Build (unsigned AAB)
        if: success()
        run: ./gradlew --no-daemon app:lintMetaRelease app:bundleMetaRelease

      - name: Confirm AAB is unsigned
        if: success()
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/metaRelease/getline-vpn-*.aab | head -n1)
          echo "Checking: $AAB"
          # jarsigner -verify often exits 0 for both signed and unsigned AABs;
          # inspect the message text instead of the exit code.
          jarsigner -verify "$AAB" >/tmp/jarsigner-out.txt 2>&1 || true
          cat /tmp/jarsigner-out.txt
          if grep -qi 'jar verified' /tmp/jarsigner-out.txt; then
            echo "ERROR: pre-release AAB is signed; expected unsigned verification artifact"
            exit 1
          fi
          if ! grep -qi 'jar is unsigned\|unsigned' /tmp/jarsigner-out.txt; then
            echo "ERROR: could not confirm unsigned state from jarsigner output"
            exit 1
          fi
          echo "OK: AAB is unsigned (verification build)"

      - name: Upload unsigned Meta AAB
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: GetLineVPN Meta Release Unsigned AAB
          path: |
            app/build/outputs/bundle/metaRelease/getline-vpn-*.aab
