name: Build Release

# Production signing job. Fails closed if release key material is missing.
# Does not publish to Google Play (manual Play Console / internal testing only).
#
# The version is a function of the tagged source, never of the build event:
# F-Droid must be able to rebuild `metaProdRelease` from the public tag and
# compare artifacts (see fdroid/README.md). A versionCode taken from
# GITHUB_RUN_NUMBER would not be derivable from source and would break that.
#
# Policy: docs/release-policy.md
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: patch or minor (major is refused while 0.x)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      build_aab:
        description: 'Also build the signed Play AAB (only needed for a Play upload)'
        required: false
        type: boolean
        default: false

# Two release runs must not both read the current version and both try to
# publish the next one.
concurrency:
  group: getline-release
  cancel-in-progress: false

jobs:
  BuildRelease:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse to release from anywhere but main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: releases run from main only (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # A standard hosted runner has ~14 GB free on /, and one release build of
      # this project (Go core + NDK + R8 + ABI splits) does not fit next to the
      # preinstalled toolchains: the first attempt died with
      # "R8: java.io.IOException: No space left on device".
      # Explicit rm avoids another third-party action. External actions run only
      # before key restoration or after signing teardown.
      - name: Free runner disk space
        # Under act this would prune the developer's Docker host through its
        # socket. The full runner image is managed outside the local job.
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          # Deliberately not touching the Android SDK/NDK, Java or Go: the four
          # paths below plus the docker images free well over 10 GB on their own.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo product patches
        run: ./scripts/apply-mihomo-patches.sh

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          java-version: "21.0.10+7.0.LTS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-pinned-go

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Mihomo security gate
        run: ./scripts/verify-mihomo-gate.sh

      # versionName: bump the value committed by the previous release.
      # versionCode: previous + 1 — it numbers published releases, not builds,
      # so rebuilding a tag legitimately yields the same code.
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CUR_NAME=$(grep -oP '^\s*versionName = "\K[^"]+' build.gradle.kts)
          CUR_CODE=$(grep -oP '^\s*versionCode = \K[0-9]+' build.gradle.kts)
          echo "current: $CUR_NAME ($CUR_CODE)"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR_NAME"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major)
              if [ "$MAJOR" -eq 0 ]; then
                echo "ERROR: refusing an automated 0.x -> 1.0.0 bump."
                echo "Going 1.0 is a deliberate act: edit build.gradle.kts on main"
                echo "in a reviewed PR, then release with bump=patch."
                exit 1
              fi
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *) echo "ERROR: unknown bump '$BUMP'"; exit 1 ;;
          esac
          NEW_NAME="$MAJOR.$MINOR.$PATCH"

          # One-time floor: 2000 escaped to a device as an accidental 0.2.0
          # build, and Android refuses a lower code on update.
          NEW_CODE=$((CUR_CODE + 1))
          if [ "$NEW_CODE" -lt 2001 ]; then
            NEW_CODE=2001
          fi

          echo "next: $NEW_NAME ($NEW_CODE)"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The PR gate only sees its own pull request, and several PRs land between
      # releases, so the dispatch input must not understate what accumulated.
      # Range start: the last commit that changed the version line — not
      # `git describe`, which would find an inherited upstream tag (v2.11.32).
      - name: Bump input covers the accumulated commits
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          base=$(git log -1 --format=%H -G'^\s*versionName = ' -- build.gradle.kts)
          subjects=$(git log --format='%s' "$base..HEAD")
          bodies=$(git log --format='%B' "$base..HEAD")
          printf 'commits since %s:\n%s\n' "${base:0:8}" "$subjects"

          breaking=0; feat=0; fix=0; product=0
          if printf '%s' "$bodies" | grep -qE '^BREAKING[ -]CHANGE'; then breaking=1; fi
          while IFS= read -r s; do
            [ -n "$s" ] || continue
            type=$(printf '%s' "$s" | grep -oE '^[a-z]+(\([^)]*\))?!?:' || true)
            # Fail closed. A free-form subject cannot be classified, so skipping
            # it would let "Add servers screen" hide a feat behind bump=patch.
            # Merges are squash-only and the PR gate validates the squash title,
            # so anything unclassifiable here arrived outside that path (a direct
            # push or a local merge) and needs a human.
            if [ -z "$type" ]; then
              echo "ERROR: subject is not a Conventional Commit: $s"
              echo "The required bump cannot be derived. Fix the subject on main"
              echo "or release from a commit range that does not contain it."
              exit 1
            fi
            case "$type" in *'!:') breaking=1 ;; esac
            case "${type%%[(!:]*}" in
              feat) feat=1 ;;
              fix|perf) fix=1 ;;
              refactor|build|revert) product=1 ;;
              *) : ;;
            esac
          done <<< "$subjects"

          if [ "$breaking" -eq 1 ] || [ "$feat" -eq 1 ]; then required=minor
          elif [ "$fix" -eq 1 ] || [ "$product" -eq 1 ]; then required=patch
          else required=none; fi

          rank() { case "$1" in none) echo 0 ;; patch) echo 1 ;; minor) echo 2 ;; major) echo 3 ;; esac; }
          if [ "$(rank "$BUMP")" -lt "$(rank "$required")" ]; then
            echo "ERROR: commits since the last version change require at least '$required',"
            echo "but this run was dispatched with bump='$BUMP'."
            exit 1
          fi
          echo "OK: bump='$BUMP' covers required minimum '$required'"

      - name: Tag must not exist yet
        # Remote tag state and token semantics belong to the real GitHub gate.
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $TAG already exists — a release for this version was published."
            exit 1
          fi
          echo "OK: $TAG is free"

      # Local only. Pre-push failures publish neither the release commit nor tag.
      # GitHub Release creation happens after the atomic push; failure there
      # requires the operator recovery documented in docs/release-policy.md.
      - name: Write version and create the release commit locally
        id: release_commit
        run: |
          set -euo pipefail
          NEW_NAME="${{ steps.version.outputs.name }}"
          NEW_CODE="${{ steps.version.outputs.code }}"
          TAG="v$NEW_NAME"

          # act may be invoked with --bind, which exposes the developer's real
          # checkout. Validate the rewrite on a disposable copy and never edit,
          # commit or tag that checkout during a local preflight.
          if [ -n "${ACT:-}" ]; then
            VERSION_FILE="$RUNNER_TEMP/build.gradle.kts"
            cp build.gradle.kts "$VERSION_FILE"
            sed -i -E "s/^([[:space:]]*)versionName = \".*\"/\1versionName = \"$NEW_NAME\"/" "$VERSION_FILE"
            sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\1versionCode = $NEW_CODE/" "$VERSION_FILE"
            grep -q "versionName = \"$NEW_NAME\"" "$VERSION_FILE"
            grep -q "versionCode = $NEW_CODE" "$VERSION_FILE"
            echo "ACT preflight: version rewrite validated without modifying the checkout."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i -E "s/^([[:space:]]*)versionName = \".*\"/\1versionName = \"$NEW_NAME\"/" build.gradle.kts
          sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\1versionCode = $NEW_CODE/" build.gradle.kts
          grep -q "versionName = \"$NEW_NAME\"" build.gradle.kts
          grep -q "versionCode = $NEW_CODE" build.gradle.kts

          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add build.gradle.kts
          git commit -m "chore(release): $NEW_NAME ($NEW_CODE)"
          # Single owner of the tag: created here, on the release commit, and
          # never moved. F-Droid resolves tag -> source, so a moved tag would
          # silently change the source of a published release.
          git tag "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Signing files live in RUNNER_TEMP, outside the checked-out workspace.
      # Secrets are referenced only by this workflow_dispatch-only job — never
      # by a pull_request workflow.
      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: secret SIGNING_KEYSTORE_BASE64 is empty"
            exit 1
          fi
          keystore="$RUNNER_TEMP/getline-release.keystore"
          properties="$RUNNER_TEMP/getline-signing.properties"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "GETLINE_SIGNING_KEYSTORE=$keystore"
            echo "GETLINE_SIGNING_PROPERTIES=$properties"
          } >> "$GITHUB_ENV"

      # Fail closed before anything is published: a wrong keystore must not be
      # able to create a release tag. The expected value is a repository
      # variable, not a secret — the fingerprint is published in Digital Asset
      # Links anyway, and a signature that disagrees with the deployed
      # assetlinks.json breaks Auth Tab sign-in (observed 2026-07-30).
      - name: Selected signing certificate matches the deployed DAL
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          EXPECTED: ${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            echo "ERROR: secret SIGNING_KEY_ALIAS is empty"
            exit 1
          fi
          if [ -z "${EXPECTED:-}" ]; then
            echo "ERROR: repository variable EXPECTED_SIGNING_CERT_SHA256 is not set."
            echo "Set it to the fingerprint published in .well-known/assetlinks.json."
            exit 1
          fi
          norm() { tr -d ': \n' | tr 'a-f' 'A-F'; }
          if ! actual=$(keytool -list -keystore "$GETLINE_SIGNING_KEYSTORE" \
               -alias "$SIGNING_KEY_ALIAS" \
               -storepass "$SIGNING_STORE_PASSWORD" 2>/dev/null \
               | grep -i 'SHA-256' | head -n1 \
               | grep -oE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}'); then
            echo "ERROR: cannot read the selected alias certificate from the release keystore."
            echo "Check SIGNING_KEY_ALIAS and SIGNING_STORE_PASSWORD."
            exit 1
          fi
          if [ "$(printf '%s' "$actual" | norm)" != "$(printf '%s' "$EXPECTED" | norm)" ]; then
            echo "ERROR: selected signing certificate does not match the expected fingerprint."
            echo "  keystore: $actual"
            echo "  expected: $EXPECTED"
            exit 1
          fi
          echo "OK: signing certificate matches EXPECTED_SIGNING_CERT_SHA256"

      - name: Require production signing material
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ ! -s "$GETLINE_SIGNING_KEYSTORE" ]; then
            echo "ERROR: release keystore is missing or empty"
            missing=1
          fi
          for var in SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: secret $var is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing silent debug signing."
            exit 1
          fi
          # Gradle only discovers a wrong alias when it signs, i.e. after a
          # ~13-minute build (observed 2026-07-30: "No key with alias '***'
          # found in keystore", caused by whitespace pasted into the secret).
          if ! keytool -list -keystore "$GETLINE_SIGNING_KEYSTORE" \
               -alias "$SIGNING_KEY_ALIAS" \
               -storepass "$SIGNING_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "ERROR: SIGNING_KEY_ALIAS does not name an entry in the release keystore."
            echo "Check for a trailing space or newline in the secret value."
            exit 1
          fi
          # Fingerprint is public — it is published in Digital Asset Links — and
          # this log is the only record of which key signed a given release.
          keytool -list -keystore "$GETLINE_SIGNING_KEYSTORE" \
            -alias "$SIGNING_KEY_ALIAS" \
            -storepass "$SIGNING_STORE_PASSWORD" 2>/dev/null | grep -i "SHA-256" || {
              echo "ERROR: release keystore unreadable with SIGNING_STORE_PASSWORD"
              exit 1
            }
          echo "Production signing material is present (values not logged)."

      - name: Write signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Never print signing.properties or secret values to the job log.
          {
            echo "keystore.password=${SIGNING_STORE_PASSWORD}"
            echo "key.alias=${SIGNING_KEY_ALIAS}"
            echo "key.password=${SIGNING_KEY_PASSWORD}"
          } > "$GETLINE_SIGNING_PROPERTIES"
          chmod 600 "$GETLINE_SIGNING_PROPERTIES"
          echo "Signing properties written outside the workspace (contents not logged)."

      # Two invocations on purpose: build.gradle.kts disables ABI splits when a
      # bundle task is in the same invocation, so combining them would silently
      # produce a single universal APK instead of the per-ABI set.
      - name: Release build — signed alpha APKs
        run: |
          df -h / | tail -1
          ./gradlew --no-daemon app:assembleAlphaProdRelease
          df -h / | tail -1

      # Off by default. Nothing consumes this artifact yet: the app is not on
      # Play, and F-Droid rebuilds metaProdRelease from the tag itself. The Play
      # shape is already validated on every push to main by build-pre-release
      # (unsigned bundleMetaProdRelease + lint), so building it again here only
      # doubled the peak disk usage — which is what ran the runner out of space.
      - name: Release build — signed meta AAB
        # act 0.2.89 does not populate the typed inputs context for this boolean,
        # but does preserve it in the event payload. Keep that compatibility
        # path ACT-only; GitHub continues to use the typed workflow input.
        if: ${{ inputs.build_aab == true || (env.ACT && (github.event.inputs.build_aab == true || github.event.inputs.build_aab == 'true')) }}
        run: |
          df -h / | tail -1
          du -xhd1 "$GITHUB_WORKSPACE" "$HOME/.gradle" 2>/dev/null | sort -h | tail -8
          ./gradlew --no-daemon app:lintMetaProdRelease app:bundleMetaProdRelease

      - name: Verify signatures and collect audit data
        id: audit
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          APK=$(ls app/build/outputs/apk/alphaProd/release/getline-vpn-*-universal-release.apk | head -n1)

          # The AAB is optional (build_aab); verify it only when it was built.
          AAB=$(ls app/build/outputs/bundle/metaProdRelease/getline-vpn-*.aab 2>/dev/null | head -n1 || true)
          if [ -n "$AAB" ]; then
            jarsigner -verify -verbose -certs "$AAB" > /tmp/jarsigner-verify.txt
            if ! grep -q "jar verified" /tmp/jarsigner-verify.txt; then
              echo "ERROR: production AAB signature verification failed"
              exit 1
            fi
            if grep -qi "Android Debug\|AndroidDebugKey" /tmp/jarsigner-verify.txt; then
              echo "ERROR: production AAB appears to be debug-signed"
              exit 1
            fi
            AAB_SHA=$(sha256sum "$AAB" | cut -d' ' -f1)
          else
            AAB_SHA='not built (build_aab=false)'
          fi

          # ACT validates the version rewrite on a temporary file so even an
          # accidental --bind cannot dirty the developer's checkout. Report the
          # version actually embedded by Gradle, not the computed next version.
          AUDIT_NAME="${{ steps.version.outputs.name }}"
          AUDIT_CODE="${{ steps.version.outputs.code }}"
          if [ -n "${ACT:-}" ]; then
            AUDIT_NAME=$(grep -oP '^\s*versionName = "\K[^"]+' build.gradle.kts)
            AUDIT_CODE=$(grep -oP '^\s*versionCode = \K[0-9]+' build.gradle.kts)
          fi

          "$APKSIGNER" verify --print-certs "$APK" > /tmp/apksigner-verify.txt 2>/dev/null
          if grep -qi "AndroidDebugKey" /tmp/apksigner-verify.txt; then
            echo "ERROR: alpha APK appears to be debug-signed"
            exit 1
          fi
          CERT_SHA=$(grep -oiP 'certificate SHA-256 digest:\s*\K[0-9a-f]+' /tmp/apksigner-verify.txt | head -n1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')

          # The artifact itself must carry the expected certificate, not just the
          # keystore that was restored.
          norm() { tr -d ': \n' | tr 'a-f' 'A-F'; }
          if [ "$(printf '%s' "$CERT_SHA" | norm)" != "$(printf '%s' "${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}" | norm)" ]; then
            echo "ERROR: signed APK carries an unexpected certificate: $CERT_SHA"
            exit 1
          fi

          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)

          {
            echo "### Release audit"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| versionName | $AUDIT_NAME |"
            echo "| versionCode | $AUDIT_CODE |"
            if [ -n "${ACT:-}" ]; then
              echo "| computed next version (ACT only) | ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |"
              echo "| computed tag (ACT only, not created) | ${{ steps.release_commit.outputs.tag }} |"
              echo "| checkout HEAD (ACT only) | ${{ steps.release_commit.outputs.sha }} |"
            else
              echo "| tag | ${{ steps.release_commit.outputs.tag }} |"
              echo "| commit | ${{ steps.release_commit.outputs.sha }} |"
            fi
            echo "| certificate SHA-256 | \`$CERT_SHA\` |"
            echo "| alpha APK (universal) SHA-256 | \`$APK_SHA\` |"
            echo "| meta AAB SHA-256 | \`$AAB_SHA\` |"
            echo ""
            echo "The certificate fingerprint must match the deployed"
            echo "\`.well-known/assetlinks.json\`, otherwise Auth Tab sign-in fails with"
            echo "\`RESULT_VERIFICATION_FAILED\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "OK: artifacts signed with a non-debug key."

      # This is an always() teardown so failed builds and signature checks do
      # not leave the key available to later steps. No external action runs
      # between restoring the key and removing both signing files.
      - name: Remove signing material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/getline-release.keystore" "$RUNNER_TEMP/getline-signing.properties"
          if [ -e "$RUNNER_TEMP/getline-release.keystore" ] \
             || [ -e "$RUNNER_TEMP/getline-signing.properties" ]; then
            echo "ERROR: failed to remove signing material"
            exit 1
          fi
          echo "Signing material removed."

      # Everything above is local and reversible. This is the first irreversible
      # step, and it runs only after every artifact exists and every signature
      # check has passed.
      - name: Publish release commit and tag
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          # Serialization guard: fail rather than clobber a main that moved while
          # this run was building.
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "${{ steps.version.outputs.base_sha }}" ]; then
            echo "ERROR: main moved during the release run. Nothing was published;"
            echo "re-run the workflow from the current main."
            exit 1
          fi
          git push --atomic origin "HEAD:main" "refs/tags/${{ steps.release_commit.outputs.tag }}"

      - name: Upload Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release_commit.outputs.tag }}
          files: |
            app/build/outputs/bundle/metaProdRelease/getline-vpn-*.aab
            app/build/outputs/apk/alphaProd/release/getline-vpn-*-release.apk
          generate_release_notes: true
          # Derived from the version, not a fixed flag: every 0.x build is a
          # pre-release and must not become "Latest release"; this switches
          # itself off at 1.0.0.
          prerelease: ${{ startsWith(steps.version.outputs.name, '0.') }}

      - name: Notify Telegram
        if: ${{ !env.ACT }}
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
        run: |
          set -euo pipefail

          TAG="${{ steps.release_commit.outputs.tag }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"

          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "ERROR: Telegram release secrets are missing"
            exit 1
          fi

          PAYLOAD="$(
            jq -n \
              --arg chat_id "$TG_CHAT_ID" \
              --arg text "🚀 GetLine VPN ${TAG} опубликован

          Скачать и посмотреть изменения:
          ${RELEASE_URL}" \
              '{
                chat_id: $chat_id,
                text: $text
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output /dev/null
