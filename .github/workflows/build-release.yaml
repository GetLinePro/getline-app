name: Build Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (v2.x.x)'
        required: true

# Production signing job. Fails closed if release key secrets are missing.
# Does not publish to Google Play (manual Play Console / internal testing only).
jobs:
  BuildRelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo product patches
        run: ./scripts/apply-mihomo-patches.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21.0.10+7.0.LTS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: ./.github/actions/setup-pinned-go

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Mihomo security gate
        run: ./scripts/verify-mihomo-gate.sh
      
      - name: Convert and set version env
        id: process-version
        run: |
          VERSION_TAG=${{ inputs.release-tag }}
          VERSION_TAG=${VERSION_TAG#v}                              # remove the 'v' prefix
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_TAG"         # split into array
          # Arithmetic, not printf: a 0.x tag would zero-pad to "001000", and Kotlin
          # rejects integer literals with leading zeros ("Unsupported [literal
          # prefixes and suffixes]"), so build.gradle.kts would stop compiling.
          VERSION_CODE=$(( VERSION_PARTS[0] * 100000 + VERSION_PARTS[1] * 1000 + VERSION_PARTS[2] ))

          echo "versonName=$VERSION_TAG" >> $GITHUB_OUTPUT          # "1.2.3"
          echo "versonCode=$VERSION_CODE" >> $GITHUB_OUTPUT         # "102003"
      
      # Re-write version in build.gradle.kts
      - name: Re-write version
        uses: Devofure/advance-android-version-actions@v1.5
        with:
          gradlePath: build.gradle.kts
          versionCode: ${{ steps.process-version.outputs.versonCode }}
          versionName: ${{ steps.process-version.outputs.versonName }}
      
      # If any change found, commit it and push
      - name: Commit and push if changes
        run: |
          changes=$(git diff --name-only origin/main | wc -l)
          if [ $changes -gt 0 ]
          then
            newVersionName=${{ steps.process-version.outputs.versonName }}
            newVersionCode=${{ steps.process-version.outputs.versonCode }}
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add build.gradle.kts
            git commit -am "Bump version to $newVersionName ($newVersionCode)"
            git tag "v$newVersionName"
            git push --follow-tags
          fi

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Require production signing material
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ ! -f release.keystore ]; then
            echo "ERROR: release.keystore is missing (owner-controlled production key)"
            missing=1
          fi
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ]; then
            echo "ERROR: secret SIGNING_STORE_PASSWORD is empty"
            missing=1
          fi
          if [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            echo "ERROR: secret SIGNING_KEY_ALIAS is empty"
            missing=1
          fi
          if [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "ERROR: secret SIGNING_KEY_PASSWORD is empty"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Production release refuses to build without a complete release key."
            echo "Refusing silent debug signing."
            exit 1
          fi
          echo "Production signing material is present (values not logged)."

      - name: Write signing.properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Never print signing.properties or secret values to the job log.
          {
            echo "keystore.password=${SIGNING_STORE_PASSWORD}"
            echo "key.alias=${SIGNING_KEY_ALIAS}"
            echo "key.password=${SIGNING_KEY_PASSWORD}"
          } > signing.properties
          chmod 600 signing.properties
          echo "signing.properties written (contents not logged)."

      - name: Release Build (signed AAB)
        if: success()
        run: ./gradlew --no-daemon app:lintMetaRelease app:bundleMetaRelease

      - name: Verify AAB is signed
        if: success()
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/metaRelease/getline-vpn-*.aab | head -n1)
          echo "Verifying signature on: $AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/jarsigner-verify.txt
          # jarsigner -verify succeeds only when a signature is present.
          if ! grep -q "jar verified" /tmp/jarsigner-verify.txt; then
            echo "ERROR: production AAB signature verification failed"
            exit 1
          fi
          # Guard against accidental debug/AndroidDebugKey signing.
          if grep -qi "Android Debug\|CN=Android Debug\|AndroidDebugKey" /tmp/jarsigner-verify.txt; then
            echo "ERROR: production AAB appears to be debug-signed"
            exit 1
          fi
          echo "OK: production AAB is signed (non-debug)."

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ inputs.release-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: ${{ success() }}
        with:
          tag_name: ${{ inputs.release-tag }}
          files: app/build/outputs/bundle/metaRelease/getline-vpn-*.aab
          generate_release_notes: true

      - name: Release Changelog Builder
        uses: mikepenz/release-changelog-builder-action@v4.1.1
        with:
          configurationJson: |
            {
              "ignore_labels": [
                "Update"
              ],
            }
