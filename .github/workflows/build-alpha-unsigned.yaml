name: Build Alpha (unsigned)
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildAlphaUnsigned:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo product patches
        run: ./scripts/apply-mihomo-patches.sh

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21.0.10+7.0.LTS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: ./.github/actions/setup-pinned-go

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Mihomo security gate
        run: ./scripts/verify-mihomo-gate.sh

      # This job builds the release build type without any signing material.
      # Pull requests only need the build result, so they upload no binaries.
      # Main/manual runs retain one universal APK briefly for diagnostics; it is
      # UNSIGNED and cannot be installed. Do not add production signing here: the
      # block that used to sit commented out at this spot also ran
      # `cat signing.properties`, which would print release passwords into the
      # job log, and pull requests from this repository do receive secrets.
      # Signed artifacts come only from build-release.yaml.

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaProdRelease
          
      - name: Upload unsigned universal APK
        uses: actions/upload-artifact@v7
        if: ${{ success() && github.event_name != 'pull_request' }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (universal)
          path: |
            app/build/outputs/apk/alphaProd/release/*-universal-*.apk
          retention-days: 1
