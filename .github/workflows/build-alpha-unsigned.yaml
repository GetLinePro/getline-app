name: Build Alpha (unsigned)

# No `push: main` trigger on purpose. pr-hygiene already requires the branch to
# contain current main before it calls this workflow, so the post-merge rebuild
# compiled the same tree a second time and produced an APK that is unsigned and
# cannot be installed. On a private repo that duplicate is billed Actions
# minutes for no new information.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  BuildAlphaUnsigned:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Unit tests and the native build share one standard hosted-runner disk.
      # Keep the Android SDK/NDK, Java and Go; remove only preinstalled stacks
      # this Android job never uses. This is the same proven budget relief as
      # the signed release workflow.
      - name: Free runner disk space
        # Under act, docker prune would target the developer's Docker host.
        if: ${{ !env.ACT }}
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo product patches
        run: ./scripts/apply-mihomo-patches.sh

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21.0.10+7.0.LTS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: ./.github/actions/setup-pinned-go

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Mihomo security gate
        run: ./scripts/verify-mihomo-gate.sh

      - name: Test application-owned Go config bridge
        working-directory: core/src/main/golang
        run: go test ./native/config

      # This job builds the release build type without any signing material.
      # Pull requests only need the build result, so they upload no binaries.
      # Main/manual runs retain one universal APK briefly for diagnostics; it is
      # UNSIGNED and cannot be installed. Do not add production signing here: the
      # block that used to sit commented out at this spot also ran
      # `cat signing.properties`, which would print release passwords into the
      # job log, and pull requests from this repository do receive secrets.
      # Signed artifacts come only from build-release.yaml.

      # Cheap before expensive: unit tests need no native core, so a logic
      # regression fails here in about a minute instead of after the ABI builds.
      - name: Unit tests
        if: success()
        run: |
          df -h / | tail -1
          ./gradlew --no-daemon \
            service:testAlphaReleaseUnitTest \
            getlineui:testAlphaReleaseUnitTest \
            app:testAlphaProdReleaseUnitTest \
            app:testAlphaE2eDebugUnitTest
          df -h / | tail -1

      # GL-22 / #76: prove release strip is not a silent no-op. process*Manifest
      # is cheaper than assemble and is enough for the merged-manifest check.
      - name: Advanced release gate (merged manifests)
        if: success()
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:processAlphaProdReleaseMainManifest \
            :app:processAlphaProdDebugMainManifest
          ./scripts/check-advanced-release-gate.sh --require-merged
          ./scripts/check-release-fgs-gate.sh --require-merged

      # One ABI decision for both the Gradle build and the artifact gate.
      # Duplicating the pull_request expression would let the gate inspect
      # files this run never built (or skip ones it did). docs/release-policy.md.
      - name: Native ABI set for this run
        id: native_abis
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "gradle=-Pgetline.abis=arm64-v8a" >> "$GITHUB_OUTPUT"
            echo "abis=arm64-v8a" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=" >> "$GITHUB_OUTPUT"
            echo "abis=arm64-v8a,armeabi-v7a,x86,x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint app and build
        if: success()
        env:
          ABI_ARGS: ${{ steps.native_abis.outputs.gradle }}
        run: |
          df -h / | tail -1
          # Product scope only: :app excludes inherited CMFA code/resources via
          # app/lint.xml; :getlineui is fully owned here. Do not add the
          # inherited CMFA library modules or checkDependencies.
          ./gradlew --no-daemon $ABI_ARGS \
            app:lintAlphaProdRelease \
            getlineui:lintAlphaRelease \
            app:assembleAlphaProdRelease
          df -h / | tail -1

      # Explicit paths only: a glob could pass stale .so if this run did not
      # write the file. ABI list comes from native_abis, not a second expression.
      - name: Verify libclash.so artifact gate
        if: success()
        env:
          ABIS: ${{ steps.native_abis.outputs.abis }}
        run: |
          set -euo pipefail
          files=()
          IFS=',' read -r -a abi_list <<< "$ABIS"
          for abi in "${abi_list[@]}"; do
            files+=("core/build/outputs/golang/alphaRelease/${abi}/libclash.so")
          done
          ./scripts/check-libclash-artifact-gate.sh "${files[@]}"

      - name: Upload unsigned universal APK
        uses: actions/upload-artifact@v7
        if: ${{ success() && github.event_name != 'pull_request' }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (universal)
          path: |
            app/build/outputs/apk/alphaProd/release/*-universal-*.apk
          retention-days: 1
