name: Build Alpha (unsigned)
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  BuildAlphaUnsigned:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Apply Mihomo product patches
        run: ./scripts/apply-mihomo-patches.sh

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21.0.10+7.0.LTS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: ./.github/actions/setup-pinned-go

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify Mihomo security gate
        run: ./scripts/verify-mihomo-gate.sh

      # This job builds the release build type without any signing material, so
      # the artifacts are UNSIGNED and cannot be installed — they verify that the
      # release configuration compiles. Do not add production signing here: the
      # block that used to sit commented out at this spot also ran
      # `cat signing.properties`, which would print release passwords into the
      # job log, and pull requests from this repository do receive secrets.
      # Signed artifacts come only from build-release.yaml.

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaProdRelease
          
      - name: Upload Aritfact (universal)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (universal) 
          path: |
            app/build/outputs/apk/alphaProd/release/*-universal-*.apk
      
      - name: Upload Aritfact (arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (arm64-v8a)
          path: |
            app/build/outputs/apk/alphaProd/release/*-arm64-v8a-*.apk
      
      - name: Upload Aritfact (armeabi-v7a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (armeabi-v7a)
          path: |
            app/build/outputs/apk/alphaProd/release/*-armeabi-v7a-*.apk
      
      - name: Upload Aritfact (x86_64)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (x86_64)
          path: |
            app/build/outputs/apk/alphaProd/release/*-x86_64-*.apk
      
      - name: Upload Aritfact (x86)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: GetLineVPN Alpha Prod unsigned APK ${{ github.sha }} (x86)
          path: |
            app/build/outputs/apk/alphaProd/release/*-x86-*.apk
