name: PR hygiene

# Fast blocking gates. Unlike security-baseline (advisory, continue-on-error),
# a failure here must stop the merge.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  workflow_dispatch:

jobs:
  hygiene:
    name: Branch, base and tracked-secrets checks
    runs-on: ubuntu-24.04
    steps:
      # Fail before checkout or runner-heavy reusable workflows when the PR
      # cannot satisfy release policy yet.
      - name: Release intent is declared
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          intents=$(printf '%s' "$LABELS" | grep -oE 'release:(patch|minor|major|none)' | sort -u || true)
          count=$(printf '%s' "$intents" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "ERROR: expected exactly one release:* label, found ${count:-0}."
            echo "Use release:patch, release:minor, release:major or release:none."
            exit 1
          fi
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!?: .+'; then
            echo "ERROR: PR title is not a Conventional Commit: $PR_TITLE"
            exit 1
          fi
          echo "OK: release intent and PR title declared"

      - name: Checkout PR head (not the merge commit)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Prefixes mirror Conventional Commit types, so the branch name and the
      # commit messages speak the same language. The version bump is derived
      # from commits, never from the branch name: this repo already had a
      # branch that started as feat/… and shipped only fixes.
      - name: Branch name follows the convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|chore|ci|docs|refactor|perf|test|build|revert)/[a-z0-9][a-z0-9._-]*$'
          if ! printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "ERROR: branch name '$BRANCH' does not match $pattern"
            echo "Examples: fix/auth-callback-edge-shim, ci/pr-hygiene-gates"
            exit 1
          fi
          echo "OK: branch name '$BRANCH'"

      # GitHub's native "require branches to be up to date" lives in branch
      # protection, which is not available for private repos on the free plan
      # (API returns 403 here), so the check is done in CI instead.
      - name: Branch contains current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor refs/remotes/origin/main HEAD; then
            behind=$(git rev-list --count HEAD..refs/remotes/origin/main)
            echo "ERROR: branch is not based on current main ($behind commit(s) behind)."
            echo "Rebase onto main and force-push:"
            echo "  git fetch origin && git rebase origin/main"
            exit 1
          fi
          echo "OK: branch contains origin/main"

      # Signing material is git-ignored by policy; a gate makes the policy
      # enforceable rather than aspirational.
      - name: No signing material tracked
        run: |
          set -euo pipefail
          # Suffix-tolerant: a plain `\.keystore$` missed
          # release.keystore.bak-2026-07-30, which .gitignore did not cover either.
          hits=$(git ls-files \
            | grep -Ei '(^|/)\.?(signing|local)\.properties|(^|/)getline-signing-backup-|\.(keystore|jks|p12|pepk|swp)(\.|$)' \
            || true)
          if [ -n "$hits" ]; then
            echo "ERROR: signing material is tracked in git:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK: no keystore / signing.properties tracked"

      # Release Java networking must not trust user-installed CAs. Check every
      # source set so a future release resource override cannot reopen it.
      - name: Release network config rejects user certificates
        run: |
          set -euo pipefail
          hits=$(grep -RInE \
            --include='network_security_config.xml' \
            "src[[:space:]]*=[[:space:]]*['\"]user['\"]" \
            app/src \
            || true)
          if [ -n "$hits" ]; then
            echo "ERROR: network security config trusts user-installed certificates:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK: network security config trusts no user-installed certificates"

      # GL-22 / #76: tools:node="remove" is a silent no-op if the activity was
      # renamed or dropped from main. Source-only check — no Gradle. The build
      # job re-checks the merged release/debug manifests after process*Manifest.
      - name: Advanced activities stay listed for release strip
        run: ./scripts/check-advanced-release-gate.sh

      # GL-12 / #39: source-only check — no Gradle. The build job re-checks
      # the merged release/debug manifests after process*Manifest.
      - name: Release FGS stays systemExempted without specialUse
        run: ./scripts/check-release-fgs-gate.sh

      # Branch protection and environment protection rules are unavailable for a
      # private repo on the free plan, and same-repo pull requests DO receive
      # secrets (only forks are restricted). This compensating gate rejects key
      # references from PR-triggered and transitively callable workflows.
      - name: Release secrets are unreachable from pull_request workflows
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"

          guarded_events = %w[pull_request pull_request_target workflow_call]
          violations = []

          Dir[".github/workflows/*.{yaml,yml}"].sort.each do |path|
            source = File.read(path)
            begin
              workflow = YAML.safe_load(source, aliases: true)
            rescue Psych::SyntaxError => error
              abort "ERROR: invalid workflow YAML in #{path}: #{error.problem} " \
                    "(line #{error.line}, column #{error.column})"
            end
            configured = workflow["on"] || workflow[true]
            events = case configured
                     when String then [configured]
                     when Array then configured
                     when Hash then configured.keys.map(&:to_s)
                     else []
                     end
            exposed = events & guarded_events
            next if exposed.empty?

            reasons = []
            strings = []
            visit = lambda do |value|
              case value
              when Hash then value.each { |key, child| visit.call(key); visit.call(child) }
              when Array then value.each { |child| visit.call(child) }
              when String then strings << value
              end
            end
            visit.call(workflow)
            secret_context = strings.any? do |value|
              value.scan(/[$][{][{](.*?)[}][}]/m).any? do |expression|
                expression.first.match?(/\bsecrets\b/)
              end
            end
            reasons << "secrets context reference" if secret_context
            jobs = workflow.fetch("jobs", {}).values
            reasons << "secrets: inherit" if jobs.any? { |job| job["secrets"] == "inherit" }
            violations << "#{path}: #{exposed.join(', ')} (#{reasons.join(', ')})" unless reasons.empty?
          end

          unless violations.empty?
            warn "ERROR: repository secrets may be reachable from PR-triggered or reusable workflows:"
            violations.each { |violation| warn "  #{violation}" }
            exit 1
          end
          RUBY
          echo "OK: PR-triggered and reusable workflows use no secrets context"

      - name: Release actions are pinned and signing files are torn down
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"

          path = ".github/workflows/build-release.yaml"
          begin
            workflow = YAML.safe_load_file(path, aliases: true)
          rescue Psych::SyntaxError => error
            abort "ERROR: invalid workflow YAML in #{path}: #{error.problem} " \
                  "(line #{error.line}, column #{error.column})"
          end
          steps = workflow.fetch("jobs").fetch("BuildRelease").fetch("steps")
          external = steps.filter_map do |step|
            reference = step["uses"]
            [path, step["name"] || reference, reference] if reference && !reference.start_with?("./")
          end
          Dir[".github/actions/**/action.{yaml,yml}"].sort.each do |action_path|
            begin
              action = YAML.safe_load_file(action_path, aliases: true)
            rescue Psych::SyntaxError => error
              abort "ERROR: invalid action YAML in #{action_path}: #{error.problem} " \
                    "(line #{error.line}, column #{error.column})"
            end
            action.fetch("runs", {}).fetch("steps", []).each do |step|
              reference = step["uses"]
              if reference && !reference.start_with?("./")
                external << [action_path, step["name"] || reference, reference]
              end
            end
          end
          unpinned = external.reject { |_, _, reference| reference.match?(/@\h{40}\z/) }
          unless unpinned.empty?
            abort "ERROR: release actions must use full commit SHAs: #{unpinned.inspect}"
          end

          restore = steps.index { |step| step["name"] == "Restore release keystore" }
          cleanup = steps.index { |step| step["name"] == "Remove signing material" }
          abort "ERROR: signing restore/teardown steps are missing or misordered" \
            unless restore && cleanup && restore < cleanup

          exposed_actions = steps[(restore + 1)...cleanup].filter_map { |step| step["uses"] }
          abort "ERROR: external action runs while signing files exist: #{exposed_actions.inspect}" \
            unless exposed_actions.empty?

          cleanup_step = steps.fetch(cleanup)
          always_expression = "$" + "{{ always() }}"
          abort "ERROR: signing teardown must use always()" \
            unless cleanup_step["if"] == always_expression
          cleanup_run = cleanup_step.fetch("run", "")
          signing_paths = %w[
            $RUNNER_TEMP/getline-release.keystore
            $RUNNER_TEMP/getline-signing.properties
          ]
          abort "ERROR: signing teardown must remove both RUNNER_TEMP files" \
            unless signing_paths.all? { |signing_path| cleanup_run.include?(signing_path) }

          restore_run = steps.fetch(restore).fetch("run", "")
          gradle = File.read("build.gradle.kts")
          required_contract = %w[GETLINE_SIGNING_KEYSTORE GETLINE_SIGNING_PROPERTIES]
          abort "ERROR: release workflow must export RUNNER_TEMP signing paths" \
            unless signing_paths.all? { |signing_path| restore_run.include?(signing_path) } &&
                   required_contract.all? { |name| restore_run.include?(name) }
          abort "ERROR: Gradle must consume the release signing path contract" \
            unless required_contract.all? { |name| gradle.include?(name) }
          RUBY
          echo "OK: release actions are pinned and RUNNER_TEMP signing files are torn down"

      # Version is owned by the release workflow, which commits it on main.
      # A hand-edited version is how 0.2.0 shipped for two fixes.
      - name: Version is not hand-edited
        run: |
          set -euo pipefail
          diff=$(git diff refs/remotes/origin/main...HEAD -- build.gradle.kts \
            | grep -E '^[+-][^+-].*version(Name|Code)' || true)
          if [ -n "$diff" ]; then
            echo "ERROR: versionName / versionCode changed by hand:"
            printf '%s\n' "$diff"
            echo "Release the version with the Build Release workflow instead"
            echo "(docs/release-policy.md)."
            exit 1
          fi
          echo "OK: version untouched"

      # Exactly one release:* label, cross-checked against the commit types in
      # the PR. The label is the human intent; commit types are the cross-check,
      # and a disagreement is a red gate rather than a silent wrong version.
      - name: Release label matches commit types
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          intents=$(printf '%s' "$LABELS" | grep -oE 'release:(patch|minor|major|none)' | sort -u || true)
          intent=${intents#release:}
          echo "intent: $intent"

          # Merges are squash-only in this repository, so the PR title becomes the
          # only subject on main. It is validated here for the same reason the
          # commits are: the release workflow reads subjects on main to re-derive
          # the required bump, and a free-form subject there could hide a feat.
          subjects=$(printf '%s\n%s\n' "$PR_TITLE" "$(git log --format='%s' refs/remotes/origin/main..HEAD)")
          bodies=$(git log --format='%B' refs/remotes/origin/main..HEAD)
          printf 'pr title:\n  %s\ncommits:\n%s\n' "$PR_TITLE" "$(git log --format='  %s' refs/remotes/origin/main..HEAD)"

          breaking=0; feat=0; fix=0; product=0
          if printf '%s' "$bodies" | grep -qE '^BREAKING[ -]CHANGE'; then breaking=1; fi
          while IFS= read -r s; do
            [ -n "$s" ] || continue
            type=$(printf '%s' "$s" | grep -oE '^[a-z]+(\([^)]*\))?!?:' || true)
            if [ -z "$type" ]; then
              echo "ERROR: commit subject is not a Conventional Commit: $s"
              exit 1
            fi
            case "$type" in
              *'!:') breaking=1 ;;
            esac
            case "${type%%[(!:]*}" in
              feat) feat=1 ;;
              fix|perf) fix=1 ;;
              refactor|build|revert) product=1 ;;
              chore|docs|test|ci) : ;;
              *) echo "ERROR: unknown commit type in: $s"; exit 1 ;;
            esac
          done <<< "$subjects"

          # Required minimum, by policy (docs/release-policy.md):
          #   breaking -> minor while 0.x (major must be deliberate, never automatic)
          #   feat     -> minor
          #   fix/perf -> patch
          #   others   -> none
          if [ "$breaking" -eq 1 ]; then required=minor
          elif [ "$feat" -eq 1 ]; then required=minor
          elif [ "$fix" -eq 1 ]; then required=patch
          elif [ "$product" -eq 1 ]; then required=patch
          else required=none; fi

          rank() {
            case "$1" in none) echo 0 ;; patch) echo 1 ;; minor) echo 2 ;; major) echo 3 ;; esac
          }
          if [ "$(rank "$intent")" -lt "$(rank "$required")" ]; then
            echo "ERROR: commits require at least release:$required, label says release:$intent."
            echo "Either raise the label or fix the commit type — a repair of a"
            echo "promised flow is 'fix', regardless of how much new code it took."
            exit 1
          fi
          echo "OK: release:$intent covers required minimum release:$required"

  security:
    name: Security baseline
    needs: hygiene
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'release:')) ||
      (github.event.action == 'edited' && github.event.changes.title != null)
    concurrency:
      group: pr-security-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/security-baseline.yaml

  build:
    name: Build Alpha (unsigned)
    needs: hygiene
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'release:')) ||
      (github.event.action == 'edited' && github.event.changes.title != null)
    concurrency:
      group: pr-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-alpha-unsigned.yaml
