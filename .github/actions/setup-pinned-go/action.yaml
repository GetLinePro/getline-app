name: Setup pinned MetaCubeX Go
description: Installs the SHA-256-verified MetaCubeX Go toolchain used by Android builds.

runs:
  using: composite
  steps:
    - name: Install MetaCubeX Go 1.26
      shell: bash
      env:
        # MetaCubeX/go publishes one rolling release, tag "build": assets are
        # re-uploaded in place and get fresh IDs, so a pinned ID 404s the moment
        # upstream refreshes it (this one did, 2026-08-14, taking every build
        # workflow with it). Re-pinning by hand is the deal until the toolchain
        # is mirrored somewhere we control.
        #
        # go1.26.6, built 2026-08-11 (go/VERSION inside the archive).
        GO_ASSET_URL: https://api.github.com/repos/MetaCubeX/go/releases/assets/513731967
        GO_ASSET_SIZE: "67734906"
        GO_ASSET_SHA256: b5cd93b9b05e96d952ee20c449306ff9ff16849393e4b484ee6165401916451a
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        archive="$(mktemp "$RUNNER_TEMP/getline-go1.26.XXXXXX.tar.gz")"
        install_root="$(mktemp -d "$RUNNER_TEMP/getline-go1.26.XXXXXX")"
        headers=(-H "Accept: application/octet-stream")
        if [[ -n "${GITHUB_TOKEN:-}" ]]; then
          headers+=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
        fi

        curl -fsSL --retry 3 "${headers[@]}" "$GO_ASSET_URL" -o "$archive"
        echo "$GO_ASSET_SHA256  $archive" | sha256sum --check --strict
        if [[ "$(stat -c '%s' "$archive")" != "$GO_ASSET_SIZE" ]]; then
          echo "Unexpected MetaCubeX Go archive size" >&2
          exit 1
        fi

        tar -xzf "$archive" -C "$install_root"
        echo "GOROOT=$install_root/go" >> "$GITHUB_ENV"
        echo "$install_root/go/bin" >> "$GITHUB_PATH"
        "$install_root/go/bin/go" version
