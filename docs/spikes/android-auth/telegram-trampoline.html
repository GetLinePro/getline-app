<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GetLine Sign-in</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      color: #e8e8e8;
      background: #1a1b1e;
    }
  </style>
</head>
<body>
  <p>Starting Telegram sign-in…</p>
  <script>
    // Same-origin trampoline only. No credentials are stored here.
    // Deploy at a path that is NOT "/" so Auth Tab completion (host + path "/")
    // does not match the initial load. Example: /android-auth/telegram
    //
    // Requires static hosting that does not rewrite this path to the SPA.
    //
    // Step 25: optional ?app_id=<applicationId> → cookie gl_app_id for
    // auth.getline.pro/auth-callback.html (Domain=.getline.pro, not HttpOnly).
    // Whitelist must match auth-callback.html ALLOWED.
    (function setAppIdCookie() {
      // Own keys only — never ALLOWED[key] (prototype keys like "constructor" are truthy).
      var ALLOWED = {
        "pro.getline.vpn": true,
        "pro.getline.vpn.alpha": true,
        "pro.getline.vpn.alpha.debug": true,
        "pro.getline.vpn.alpha.e2e.debug": true
      };
      var params = new URLSearchParams(window.location.search || "");
      var appId = (params.get("app_id") || "").trim();
      if (!appId || !Object.prototype.hasOwnProperty.call(ALLOWED, appId)) return;
      // Max-Age=600 matches PendingNativeAuth.TTL_MS (10 min).
      document.cookie =
        "gl_app_id=" + encodeURIComponent(appId) +
        "; Domain=.getline.pro; Path=/; Max-Age=600; Secure; SameSite=Lax";
    })();

    (async () => {
      try {
        const returnTo = encodeURIComponent(window.location.origin + "/");
        const response = await fetch(
          // intent=register, not login: RWP provisions the trial only on the
          // register branch, and it is idempotent — an existing account just
          // signs in. login created accounts with no trial at all.
          "/api/auth/telegram-oidc/start?intent=register&return_to=" + returnTo,
          {
            headers: { Accept: "application/json" },
            credentials: "same-origin",
          }
        );
        if (!response.ok) {
          throw new Error("start failed");
        }
        const payload = await response.json();
        if (!payload || !payload.auth_url) {
          throw new Error("auth_url missing");
        }
        // The app process never validates auth_url on this path, so validate
        // here: a compromised or misconfigured start response must not be able
        // to send the Auth Tab to an arbitrary origin.
        if (new URL(payload.auth_url).origin !== "https://oauth.telegram.org") {
          throw new Error("unexpected provider origin");
        }
        window.location.replace(payload.auth_url);
      } catch (e) {
        document.body.textContent =
          "Could not start Telegram sign-in. Close this tab and retry in the app.";
      }
    })();
  </script>
</body>
</html>
